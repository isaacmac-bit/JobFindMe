<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Strategy Session | FindMeJob</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-600 selection:text-white flex flex-col min-h-screen justify-between">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-extrabold tracking-tight text-slate-900 flex items-center gap-2">
        <span class="w-3.5 h-3.5 rounded-full bg-blue-600"></span>
        <span>FindMe<span class="text-blue-600">Job</span></span>
      </a>
      <nav class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-600">
        <a href="index.html" class="hover:text-blue-600 transition-colors">Home</a>
        <a href="process.html" class="hover:text-blue-600 transition-colors">4-Step Process</a>
        <a href="proof.html" class="hover:text-blue-600 transition-colors">Case Studies</a>
        <a href="services.html" class="hover:text-blue-600 transition-colors">Services</a>
      </nav>
      <div class="hidden sm:flex items-center">
        <a href="apply.html" class="inline-flex items-center justify-center px-5 py-2.5 rounded-lg font-bold text-sm bg-blue-600 text-white shadow-md">
          Book Strategy Call
        </a>
      </div>
    </div>
  </header>

  <!-- Intake Form -->
  <main class="py-16 md:py-20">
    <div class="max-w-4xl mx-auto px-6">
      <div class="bg-white border border-slate-200 rounded-3xl p-8 sm:p-12 shadow-xl">
        <div class="max-w-2xl mb-8">
          <span class="text-xs font-extrabold uppercase tracking-widest text-blue-600 bg-blue-100 px-3 py-1 rounded-full">Client Application</span>
          <h1 class="text-3xl font-black text-slate-900 tracking-tight mt-3 mb-2">Book Your Strategy Session</h1>
          <p class="text-slate-600 text-xs">Fill out the form below to apply for coaching and discuss your target remote role.</p>
        </div>

        <form action="https://formspree.io/f/mojgbqez" method="POST" class="space-y-6">
          <div class="grid sm:grid-cols-2 gap-6">
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Full Name</label>
              <input type="text" name="name" required placeholder="David Song" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-xs text-slate-900 focus:outline-none focus:border-blue-600">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Email Address</label>
              <input type="email" name="email" required placeholder="david@example.com" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-xs text-slate-900 focus:outline-none focus:border-blue-600">
            </div>
          </div>

          <div class="grid sm:grid-cols-2 gap-6">
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Current Role</label>
              <input type="text" name="current_role" required placeholder="e.g. Developer / Specialist" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-xs text-slate-900 focus:outline-none focus:border-blue-600">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Preferred Tier</label>
              <select name="goal" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-xs text-slate-900 focus:outline-none focus:border-blue-600">
                <option value="Resume & ATS Audit">Foundation: Resume Audit</option>
                <option value="Pipeline Accelerator">Accelerator: Pipeline & Practice</option>
                <option value="End-to-End Placement">Executive: Placement Package</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Biggest Challenge</label>
            <textarea name="challenge" rows="4" placeholder="What is currently stopping you from landing remote interviews?" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-xs text-slate-900 focus:outline-none focus:border-blue-600"></textarea>
          </div>

          <button type="submit" class="w-full py-4 rounded-xl font-bold text-xs uppercase tracking-wider bg-blue-600 hover:bg-blue-700 text-white transition-all shadow-lg shadow-blue-600/25">
            Submit Application
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="py-8 border-t border-slate-200 bg-white text-center text-xs text-slate-500">
    <p>© 2026 David Song | FindMeJob. All rights reserved.</p>
  </footer>
</body>
</html>
